<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dividend Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>
      </div>
      <div><h1>Dividend Tracker</h1><small id="today"></small></div>
    </div>
    <select class="input app-only" id="acct" aria-label="Portfolio"></select>
    <span class="pill connecting" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></span>
    <button class="btn icon app-only" id="refreshBtn" title="Refresh prices" aria-label="Refresh prices" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
    </button>
    <button class="btn icon app-only" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.800.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.500-1 1.700 1.700 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.800.3h.1a1.700 1.700 0 0 0 1-1.500V3a2 2 0 1 1 4 0v.1a1.700 1.700 0 0 0 1 1.500 1.700 1.700 0 0 0 1.800-.3l.1-.1a2 2 0 1 1 2.800 2.800l-.1.1a1.700 1.700 0 0 0-.3 1.800v.1a1.700 1.700 0 0 0 1.500 1H21a2 2 0 1 1 0 4h-.1a1.700 1.700 0 0 0-1.500 1z"/></svg>
    </button>
    <button class="btn" id="logoutBtn" data-act="signout" hidden title="Sign out">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Sign out
    </button>
    <button class="btn icon" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button class="btn primary app-only" id="addBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Add dividend
    </button>
  </header>

  <nav class="tabs app-only" role="tablist">
    <button role="tab" data-tab="dashboard">Dashboard</button>
    <button role="tab" data-tab="portfolio">Portfolio<span class="count" id="cHold">0</span></button>
    <button role="tab" data-tab="dividends">Dividends<span class="count" id="cPay">0</span></button>
    <button role="tab" data-tab="calendar">Calendar</button>
    <button role="tab" data-tab="insights">Insights</button>
    <button role="tab" data-tab="watchlist">Watchlist<span class="count" id="cWatch">0</span></button>
    <button role="tab" data-tab="market">Market</button>
  </nav>

  <div id="banner"></div>
  <main id="view"><div class="skeleton"></div></main>
</div>

<dialog id="dlg">
  <form id="dlgForm" novalidate>
    <h3 id="fTitle"></h3>
    <div class="fields" id="fFields"></div>
    <div id="fExtra"></div>
    <div class="err" id="fErr" role="alert"></div>
    <div class="dialog-actions">
      <button type="button" class="btn danger" id="fDel" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn ghost" id="fCancel">Cancel</button>
      <button type="submit" class="btn primary" id="fSave">Save</button>
    </div>
  </form>
</dialog>

<input type="file" id="bakFile" accept=".json,application/json" hidden>
<input type="file" id="csvFile" accept=".csv,text/csv" hidden>
<datalist id="tickers"></datalist>
<datalist id="accounts"></datalist>
<datalist id="sectors"></datalist>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
